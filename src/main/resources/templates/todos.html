<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <p class="flash" th:if="${message != null}" th:text="${message}"></p>

        <h1 class="page-title" th:text="${trash ? 'ごみ箱' : 'やること一覧'}">やること一覧</h1>

        <p th:unless="${trash}"><a href="/todos/new">新規登録</a> <a class="link" href="/calendar">カレンダーで見る</a> <a class="link" href="/todos?trash=1">ごみ箱を見る</a></p>
        <p th:if="${trash}"><a class="link" href="/todos">一覧へ戻る</a></p>

        <div class="search-bar" th:unless="${trash}">
            <form th:action="@{/todos}" method="get">
                <label for="keyword">やることの名前</label>
                <input type="text" id="keyword" name="keyword" th:value="${keyword}">
                <label for="category">ジャンル</label>
                <select id="category" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
                <label for="showCompleted">
                    <input type="checkbox" id="showCompleted" name="showCompleted" value="true"
                        th:checked="${showCompleted}">
                    完了したものも表示する
                </label>
                <input type="hidden" name="order" th:value="${order}">
                <input type="hidden" name="page" value="1">
                <button class="btn" type="submit">絞り込む</button>
            </form>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc',showCompleted=${showCompleted},page=${currentPage})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc',showCompleted=${showCompleted},page=${currentPage})}">期限が遠い順</a>
        </div>

        <p th:if="${#lists.isEmpty(todos)}" th:text="${trash ? 'ごみ箱は空です' : 'まだ1件も登録されていません'}">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th scope="col">やること</th>
                    <th scope="col">印</th>
                    <th scope="col">ジャンル</th>
                    <th scope="col">優先度</th>
                    <th scope="col">期限</th>
                    <th scope="col">状態</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-due-date=${todo.dueDate == null ? '' : todo.dueDate},data-completed=${todo.completed}">
                    <td><span th:text="${todo.title}">やること</span></td>
                    <td>
                        <form th:unless="${trash}" th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                            <input type="hidden" name="keyword" th:value="${keyword}">
                            <input type="hidden" name="category" th:value="${category}">
                            <input type="hidden" name="order" th:value="${order}">
                            <input type="hidden" name="showCompleted" th:value="${showCompleted}">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <button class="link" type="submit"
                                th:attr="aria-label=${todo.pinned ? '印を外す' : '印を付ける'}"
                                th:text="${todo.pinned ? '★' : '☆'}">☆</button>
                        </form>
                    </td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span>
                        <span class="priority-mark" th:if="${todo.priority == 1}" aria-label="最優先">★</span>
                    </td>
                    <td th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}">期限</td>
                    <td>
                        <span th:text="${todo.completed ? '完了' : '未完了'}">状態</span>
                        <time th:if="${todo.completedAt != null}"
                              th:datetime="${todo.completedAt}"
                              th:text="${todo.completedAt.toLocalDate()}"></time>
                    </td>
                    <td>
                        <form th:if="${trash}" th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post">
                            <button class="link" type="submit">戻す</button>
                        </form>
                        <th:block th:unless="${trash}">
                            <a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                            <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a>
                        </th:block>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav th:if="${totalPages > 1}" aria-label="ページ移動">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:href="@{/todos(keyword=${keyword},category=${category},order=${order},showCompleted=${showCompleted},trash=${trash ? 1 : null},page=${pageNumber})}"
                th:attr="aria-current=${pageNumber == currentPage ? 'page' : null}"
                th:text="${pageNumber}">1</a>
        </nav>
    </main>
    <script>
        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        document.querySelectorAll('.todo-table tbody tr').forEach(row => {
            const dueDate = row.dataset.dueDate;
            if (dueDate && dueDate < today && row.dataset.completed !== 'true') {
                row.classList.add('todo-overdue');
            }
        });
    </script>
</body>

</html>
