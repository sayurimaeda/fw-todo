<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テンプレート登録</title>
    <link rel="stylesheet" href="/css/style.css?v=theme-12">
</head>
<body>
<main class="container">
    <h1 class="page-title">テンプレート登録</h1>
    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <form action="/templates" method="post">
        <div class="form-row"><label class="form-label" for="name">名前</label><input class="form-input" id="name" name="name" maxlength="255" required></div>
        <div class="form-row"><label class="form-label" for="category">ジャンル</label><select class="form-input" id="category" name="category" required>
            <option value="">選択してください</option><option value="デザイン">デザイン</option><option value="マーケティング">マーケティング</option>
            <option value="プログラミング">プログラミング</option><option value="資格">資格</option><option value="就職活動">就職活動</option>
        </select></div>
        <div class="form-row"><label class="form-label" for="description">テンプレートの説明（固定）</label><textarea class="form-input" id="description" name="description" placeholder="テンプレート自体の説明。毎回変わる内容は作成時に入力します"></textarea></div>
        <div class="form-row"><span class="form-label">タスク項目</span><div id="template-items">
            <input class="form-input template-item" type="text" name="itemTitles" maxlength="255" required>
        </div><button class="btn sub" id="add-template-item" type="button">項目を追加</button></div>
        <button class="btn" type="submit">テンプレートを登録</button> <a class="btn sub" href="/templates">戻る</a>
    </form>
</main>
<script>
    document.getElementById('add-template-item').addEventListener('click', () => {
        const input = document.createElement('input');
        input.className = 'form-input template-item';
        input.type = 'text';
        input.name = 'itemTitles';
        input.maxLength = 255;
        input.placeholder = 'タスク名';
        input.style.marginTop = '8px';
        document.getElementById('template-items').appendChild(input);
    });
</script>
<script src="/js/theme-toggle.js?v=theme-12"></script>
</body>
</html>
