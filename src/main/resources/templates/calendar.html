<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='calendar-2')}">
</head>

<body>
    <main class="container">
        <h1 class="page-title" th:text="${displayedMonth.year + '年' + displayedMonth.monthValue + '月'}">年月</h1>

        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-navigation-group">
                <a class="link" th:href="@{/calendar(year=${previousMonth.year},month=${previousMonth.monthValue})}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextMonth.year},month=${nextMonth.monthValue})}">次の月</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="link" href="/todos">表で見る</a>
                <a class="link" href="/todos/new">新規登録</a>
            </div>
        </nav>

        <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="weekStart : ${#numbers.sequence(0, calendarDays.size() - 1, 7)}">
                    <td th:each="offset : ${#numbers.sequence(0, 6)}"
                        th:with="date=${calendarDays[weekStart + offset]}"
                        th:attr="data-date=${date != null ? date : null}">
                        <span th:if="${date != null}" th:text="${date.dayOfMonth}">日付</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function loadCalendarTodos() {
            const calendar = document.querySelector('.calendar-table');
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/todos?${params.toString()}`);
            const holidayRes = await fetch(`/api/holidays?${params.toString()}`);

            if (holidayRes.headers.has('X-Holidays-Unavailable')) {
                const message = document.createElement('p');
                message.textContent = '祝日を取れませんでした';
                document.querySelector('main.container').prepend(message);
            }

            const holidays = await holidayRes.json();
            const calendarCells = calendar.querySelectorAll('td[data-date]');
            calendarCells.forEach(cell => {
                const date = cell.dataset.date;
                const holidayName = holidays[date];
                if (holidayName) {
                    cell.title = holidayName;
                    cell.style.backgroundColor = '#fde68a';
                    return;
                }

                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();
                if (dayOfWeek === 0) {
                    cell.style.backgroundColor = '#fecaca';
                } else if (dayOfWeek === 6) {
                    cell.style.backgroundColor = '#bfdbfe';
                }
            });

            if (!res.ok) {
                return;
            }

            const todos = await res.json();
            const cellsByDate = new Map(
                Array.from(calendar.querySelectorAll('td[data-date]'), cell => [cell.dataset.date, cell])
            );
            const todosByDate = new Map();

            todos.forEach(todo => {
                if (!cellsByDate.has(todo.dueDate)) {
                    return;
                }

                if (!todosByDate.has(todo.dueDate)) {
                    todosByDate.set(todo.dueDate, []);
                }
                todosByDate.get(todo.dueDate).push(todo);
            });

            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            todosByDate.forEach((dayTodos, date) => {
                const cell = cellsByDate.get(date);
                dayTodos.slice(0, 3).forEach(todo => {
                    const taskName = document.createElement('a');
                    taskName.href = `/todos/${todo.id}/edit`;
                    taskName.className = 'link';
                    taskName.style.display = 'block';
                    taskName.textContent = todo.title;
                    if (todo.dueDate < today && !todo.completed) {
                        taskName.style.color = '#dc2626';
                    }
                    cell.append(taskName);
                });

                if (dayTodos.length > 3) {
                    const moreTasks = document.createElement('div');
                    moreTasks.textContent = `ほか ${dayTodos.length - 3}件`;
                    cell.append(moreTasks);
                }
            });
        }

        loadCalendarTodos();
    </script>
</body>

</html>
