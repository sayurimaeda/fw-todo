<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集</title>
    <link rel="stylesheet" href="/css/style.css?v=paper-6">
</head>
<body>
    <main class="container">
        <h1 class="page-title">編集</h1>

        <form th:action="@{/todos/{id}/confirm(id=${todo.id})}" th:object="${todo}" method="post">
            <div class="form-row">
                <label class="form-label" for="title">やること</label>
                <input class="form-input" type="text" id="title" th:field="*{title}">
                <button class="btn sub voice-input" type="button" data-voice-target="title">🎙 題名を音声入力</button>
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="detail">メモ</label>
                <input class="form-input" type="text" id="detail" th:field="*{detail}">
                <button class="btn sub voice-input" type="button" data-voice-target="detail">🎙 メモを音声入力</button>
                <p class="error" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="category">ジャンル</label>
                <select class="form-input" id="category" th:field="*{category}">
                    <option value="">選択してください</option>
                    <option value="デザイン">デザイン</option>
                    <option value="マーケティング">マーケティング</option>
                    <option value="プログラミング">プログラミング</option>
                    <option value="資格">資格</option>
                    <option value="就職活動">就職活動</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="priority">優先度</label>
                <select class="form-input" id="priority" th:field="*{priority}">
                    <option value="">選択してください</option>
                    <option value="1">高</option>
                    <option value="2">中</option>
                    <option value="3">低</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="naturalDueDate">期限を言葉で入力（例：明日、来週月曜）</label>
                <input class="form-input" type="text" id="naturalDueDate" data-natural-date autocomplete="off">
                <button class="btn sub voice-input" type="button" data-voice-target="naturalDueDate">🎙 期限を音声入力</button>
                <p class="date-parse-status" data-date-parse-status aria-live="polite"></p>
                <label class="form-label" for="dueDate">またはカレンダーで選択</label>
                <input class="form-input" type="date" id="dueDate" th:field="*{dueDate}">
            </div>
            <div class="form-row">
                <label class="form-label" for="completed">完了</label>
                <input class="form-input" type="checkbox" id="completed" th:field="*{completed}">
            </div>
            <button class="btn" type="submit">確認する</button>
            <a class="btn sub" href="/todos">一覧へ</a>
        </form>
    </main>
    <p class="voice-status" aria-live="polite"></p>
    <script src="/js/natural-date.js?v=date-1"></script>
    <script src="/js/voice.js?v=voice-1"></script>
    <p class="voice-status" aria-live="polite"></p>
    <script src="/js/theme-toggle.js?v=paper-1"></script>
</body>
</html>
