services:
  db:
    image: mysql:8.0
    container_name: fw-mysql
    command: --default-time-zone=+09:00
    environment:
      MYSQL_DATABASE: todoapp
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - fw-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: fw-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/todoapp
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fw-db-data:
